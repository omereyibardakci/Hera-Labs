<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hera Labs — Premium software engineering. Built with precision.">
  <meta name="theme-color" content="#090909">
  <title>Hera Labs</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header" role="banner">
    <div class="container header__inner">

      <!-- Logo -->
      <a href="#" class="header__logo" aria-label="Hera Labs — Home">
        <span class="header__logo-mark" aria-hidden="true"></span>
        <span class="header__logo-text">HERA LABS</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="header__nav" aria-label="Primary navigation">
        <ul class="header__nav-list">
          <li><a href="#about" class="header__nav-link">About</a></li>
          <li><a href="#products" class="header__nav-link">Products</a></li>
          <li><a href="#technology" class="header__nav-link">Technology</a></li>
          <li><a href="#roadmap" class="header__nav-link">Roadmap</a></li>
          <li><a href="#contact" class="header__nav-link">Contact</a></li>
        </ul>
      </nav>

      <!-- Actions -->
      <div class="header__actions">

        <!-- Language Switch -->
        <div class="lang-switch" role="group" aria-label="Language selection">
          <button type="button" class="lang-switch__btn lang-switch__btn--active" aria-pressed="true" aria-label="Turkish">TR</button>
          <span class="lang-switch__divider" aria-hidden="true"></span>
          <button type="button" class="lang-switch__btn" aria-pressed="false" aria-label="English">EN</button>
        </div>

        <!-- Theme Toggle -->
        <button type="button" class="theme-toggle" aria-label="Toggle dark / light mode">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.25"/>
              <path d="M9 1.5V3M9 15V16.5M16.5 9H15M3 9H1.5M14.2 3.8L13.1 4.9M4.9 13.1L3.8 14.2M14.2 14.2L13.1 13.1M4.9 4.9L3.8 3.8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14.5 10.2C14.5 13.5 11.8 16.2 8.5 16.2C5.2 16.2 2.5 13.5 2.5 10.2C2.5 7.5 4.1 5.2 6.5 4.2C6.1 5.1 5.9 6.1 5.9 7.2C5.9 10.5 8.6 13.2 11.9 13.2C12.9 13.2 13.9 12.9 14.7 12.4C14.6 11.7 14.5 10.9 14.5 10.2Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <!-- Mobile Menu Toggle (layout only) -->
        <button type="button" class="header__menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="header__menu-bar" aria-hidden="true"></span>
          <span class="header__menu-bar" aria-hidden="true"></span>
        </button>

      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main">

    <section id="hero" class="section section--hero" aria-label="Hero">
      <div class="container">
        <div class="section__placeholder" aria-hidden="true"></div>
      </div>
    </section>

    <section id="about" class="section section--about" aria-label="About">
      <div class="container">
        <div class="section__placeholder" aria-hidden="true"></div>
      </div>
    </section>

    <section id="products" class="section section--products" aria-label="Products">
      <div class="container">
        <div class="section__placeholder" aria-hidden="true"></div>
      </div>
    </section>

    <section id="technology" class="section section--technology" aria-label="Technology">
      <div class="container">
        <div class="section__placeholder" aria-hidden="true"></div>
      </div>
    </section>

    <section id="roadmap" class="section section--roadmap" aria-label="Roadmap">
      <div class="container">
        <div class="section__placeholder" aria-hidden="true"></div>
      </div>
    </section>

    <section id="contact" class="section section--contact" aria-label="Contact">
      <div class="container">
        <div class="section__placeholder" aria-hidden="true"></div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="container footer__inner">
      <p class="footer__copy">&copy; Hera Labs</p>
      <p class="footer__tagline">Built with precision.</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
